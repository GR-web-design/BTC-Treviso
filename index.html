<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index</title>
  <style>
    body {
      background-color: black;
      display: flex;
      flex-direction: column; /* Stack items vertically on smaller screens */
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px; /* Add some padding for better mobile viewing */
      box-sizing: border-box; /* Include padding in element's total width and height */
      text-align: center; /* Center text content */
    }
    h1 {
      color: white;
      margin-bottom: 20px; /* Add some space between heading and image */
    }

    /* Make the image occupy half of the viewport width (metà del viewport) */
    img {
      width: 50vw;      /* Image will be 50% of the viewport width */
      max-width: 90%;   /* Fallback to avoid overflow on extremely small screens */
      max-height: 50vh; /* Prevent image from exceeding half the viewport height */
      height: auto;     /* Maintain aspect ratio */
      display: block;
    }

    /* Enter button styles */
    .enter-button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background-color: #1a73e8;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      border: 0;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .enter-button:hover,
    .enter-button:focus {
      background-color: #155ab6;
      outline: none;
    }

    /* Optional: Adjust font size for better readability on smaller screens */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
      .enter-button {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <h1>BTC-TREVISO</h1>
  <img src="index_files/btc-logo.png" alt="BTC Treviso logo" title="btc">

  <!-- Enter button: change href to the page you want to link to -->
  <a href="/Bitcoiner.Guide.html" class="enter-button" role="button" aria-label="Enter site">Enter</a>
</body>
</html>
